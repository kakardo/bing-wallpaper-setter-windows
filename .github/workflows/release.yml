name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the script version
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $line = Select-String -Path .\BingWallpaperSetup.ps1 -Pattern "^\`$installerVersion = '([^']+)'" | Select-Object -First 1
          if (-not $line) { throw 'installerVersion not found in BingWallpaperSetup.ps1' }
          $scriptVersion = $line.Matches[0].Groups[1].Value
          if ($scriptVersion -ne $tag) { throw "Tag v$tag does not match installerVersion $scriptVersion in BingWallpaperSetup.ps1" }

      - name: Install ps2exe
        shell: powershell
        run: Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber

      - name: Build BingWallpaperSetup_${{ github.ref_name }}.exe
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v') + '.0'
          Invoke-ps2exe .\BingWallpaperSetup.ps1 ".\BingWallpaperSetup_${{ github.ref_name }}.exe" -iconFile .\assets\1486051840-bingsocialnetworkbrandlogo_79088.ico `
            -title "Bing Wallpaper Setter for Windows" `
            -description "Setup and management tool for Bing Wallpaper Setter. By Kardo Rostam." `
            -product "Bing Wallpaper Setter for Windows" `
            -version $version `
            -requireAdmin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: BingWallpaperSetup_v*.exe
          generate_release_notes: true
